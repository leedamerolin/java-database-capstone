<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic Management System</title>

    <!-- Favicon -->
    <link rel="icon" href="./assets/images/logo/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Utility JS -->
    <script src="./js/util.js" defer></script>
    <script src="./js/render.js" defer></script>

    <!-- Components -->
    <script src="./js/components/header.js" defer></script>
    <script src="./js/components/footer.js" defer></script>
</head>

<body>

<main>
    <div class="container">
        <div class="wrapper">

            <!-- Header -->
            <div id="header"></div>

            <!-- Main Content -->
            <main class="main-content">
                <h2>Select Your Role</h2>

                <div class="role-buttons">
                    <button id="adminBtn" onclick="selectRole('ADMIN')">Admin</button>
                    <button id="doctorBtn" onclick="selectRole('DOCTOR')">Doctor</button>
                    <button id="patientBtn" onclick="selectRole('PATIENT')">Patient</button>
                </div>
            </main>

            <!-- Footer -->
            <div id="footer"></div>

        </div>
    </div>
</main>

<!-- Modal -->
<div id="modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span id="closeModal">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<!-- Role Selection Script -->
<script>
    function selectRole(role) {
        // Store role in localStorage
        localStorage.setItem("role", role);

        // Show modal
        const modal = document.getElementById("modal");
        const modalBody = document.getElementById("modal-body");

        modal.style.display = "block";
        modalBody.innerHTML = `<h3>${role} Login</h3><p>Proceed to login...</p>`;
    }

    // Close modal
    document.getElementById("closeModal").onclick = function () {
        document.getElementById("modal").style.display = "none";
    };
</script>

<!-- Services -->
<script type="module" src="./js/services/index.js" defer></script>

</body>
</html>
