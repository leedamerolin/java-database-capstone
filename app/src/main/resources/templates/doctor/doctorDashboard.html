<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DoctorDashboard</title>

    <!-- Favicon -->
    <link rel="icon" th:href="@{/assets/images/logo/logo.png}">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <!-- Utility Scripts -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <!-- Components -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>

    <!-- Services -->
    <script type="module" th:src="@{/js/services/patientServices.js}" defer></script>
    <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</head>

<body>

<div class="container">
    <div class="wrapper">

        <!-- Header -->
        <div id="header"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Search Bar -->
            <input type="text" id="searchBar" placeholder="Search patients..." />

            <!-- Filters -->
            <div class="filters">
                <button id="todayBtn" class="dashboard-btn">Today's Appointments</button>
                <input type="date" id="dateFilter" />
            </div>

            <!-- Patient Table -->
            <table id="patientTable">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Prescription</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic rows injected via JS -->
                </tbody>
            </table>

        </main>

        <!-- Footer -->
        <div id="footer"></div>

    </div>
</div>

</body>
</html>
